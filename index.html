<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Персональная афиша событий Гданьска на ближайшие выходные" />
  <title>Gdańsk Weekend Radar</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">GR</span><div><strong>Gdańsk Weekend Radar</strong><small>личная афиша без лишнего шума</small></div></div>
    <section class="top-controls" aria-label="Поиск и фильтры">
      <label class="search"><span>⌕</span><input id="search" placeholder="поиск по событию или месту" /></label>
      <div class="filter-row"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="free">Бесплатно</button><button class="filter" data-filter="solo">Solo-friendly</button><button class="filter" data-filter="outdoor">На улице</button></div>
    </section>
    <button id="refreshBtn" class="ghost-btn" type="button">Обновить данные</button>
  </header>
  <main class="shell">
    <div id="notice" class="notice" hidden></div>
    <div class="content-layout">
      <section id="events" class="events" aria-live="polite"></section>
      <aside class="calendar-panel" aria-label="Календарь выходных">
        <p class="calendar-label">КАЛЕНДАРЬ</p>
        <div class="date-tabs"><button class="date-tab active" data-date="all">Все дни</button><button class="date-tab" data-date="2026-10-10">Сб 10 окт</button><button class="date-tab" data-date="2026-10-11">Вс 11 окт</button></div>
        <div class="calendar-stats"><div><span id="eventCount">0</span><small>событий</small></div><div><span id="checkedAt">—</span><small>проверено</small></div></div>
      </aside>
    </div>
    <section id="empty" class="empty" hidden><div class="empty-icon">◌</div><h2>Ничего не найдено</h2><p>Попробуйте снять фильтр или изменить запрос.</p></section>
    <footer><span>Источники проверяются автоматически через GitHub Actions.</span><a href="https://github.com/EmmanuilZorg/gdansk-weekend-radar" target="_blank" rel="noreferrer">Код и история обновлений ↗</a></footer>
  </main>
  <script src="./app.js" type="module"></script>
</body>
</html>
